{{- if and (not .Values.s3.existingCredentialsSecret) (or (not .Values.s3.accessKey) (not .Values.s3.secretKey)) -}}
{{- fail "Set s3.accessKey and s3.secretKey, or provide s3.existingCredentialsSecret" -}}
{{- end -}}
{{- if not .Values.s3.existingCredentialsSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nats-s3.fullname" . }}-s3-credentials
  labels:
    {{- include "nats-s3.labels" . | nindent 4 }}
type: Opaque
stringData:
  credentials.json: {{ dict "credentials" (list (dict "accessKey" .Values.s3.accessKey "secretKey" .Values.s3.secretKey)) | toJson | quote }}
{{- end }}
